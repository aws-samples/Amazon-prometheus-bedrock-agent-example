apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-demo-nopdb
  labels:
    app.kubernetes.io/name: memory-demo-nopdb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-demo-nopdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-demo-nopdb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: memory-demo-ctr-nopdb
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "205M", "--vm-hang", "1"]
          resources:
            limits:
              memory: {{ .Values.memoryDemoNopdb.resources.limits.memory | default "200Mi" | quote }}
            requests:
              memory: {{ .Values.memoryDemoNopdb.resources.requests.memory | default "100Mi" | quote }}