AWSTemplateFormatVersion: '2010-09-09'
Description: 'Amazon EKS Cluster with VPC and Node Group'

Parameters:
  NodeInstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type for the node instances

  NodeAutoScalingGroupMinSize:
    Type: Number
    Default: 3
    Description: Minimum size of Node Group ASG

  NodeAutoScalingGroupMaxSize:
    Type: Number
    Default: 5
    Description: Maximum size of Node Group ASG

  NodeVolumeSize:
    Type: Number
    Default: 20
    Description: Node volume size in GB
  
  S3ManifestFileName:
    Type: String
    Description: Name of the Kubernetes manifest file in S3
    Default: deployment.yaml
  
  SourceCodeUrl:
    Type: String
    Description: URL of the kubernetes application deployment file
    Default: https://raw.githubusercontent.com/aws-samples/Amazon-prometheus-bedrock-agent-example/refs/heads/main/deployment.yml

  AmpWorkspaceName:
    Type: String
    Description: Name for the Amazon Managed Prometheus workspace
    Default: eks-monitoring

  EksClusterName:
    Type: String
    #Default: ${AWS::StackName}-EKS
    Default: ws-eks-1
    Description: Name of the EKS cluster

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-IGW

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PublicSubnet1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PublicSubnet2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PublicRouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable
  # NAT Gateway Configuration
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-NatGateway
  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateSubnet1
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.0.4.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateSubnet2
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  # Private Route Table
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-PrivateRouteTable

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable
          
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
  
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      #Name: !Sub ${AWS::StackName}-EKS-cluster
      Name: !Ref EksClusterName
      Version: '1.32'
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        EndpointPublicAccess: true
        EndpointPrivateAccess: true 
        PublicAccessCidrs:
          - 0.0.0.0/0
        SecurityGroupIds:
          - !Ref EksClusterSecurityGroup
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
  # Security Groups
  EksClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EKS cluster
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: !GetAtt VPC.CidrBlock
        - IpProtocol: tcp
          FromPort: 8125
          ToPort: 8125
          CidrIp: !GetAtt VPC.CidrBlock
        - IpProtocol: tcp
          FromPort: 8888
          ToPort: 8888
          CidrIp: !GetAtt VPC.CidrBlock

  NodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonPrometheusFullAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
  
  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Sub ${AWS::StackName}-node-group
      NodeRole: !GetAtt NodeInstanceRole.Arn
      ScalingConfig:
        MinSize: !Ref NodeAutoScalingGroupMinSize
        MaxSize: !Ref NodeAutoScalingGroupMaxSize
        DesiredSize: !Ref NodeAutoScalingGroupMinSize
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      InstanceTypes:
        - !Ref NodeInstanceType
      DiskSize: !Ref NodeVolumeSize

  # IAM Role for AMP Scraper
  AmpScraperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: aps.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonPrometheusFullAccess
      Policies:
        - PolicyName: EksAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                Resource: !GetAtt EKSCluster.Arn

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
    
  EKSAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EKSCluster
      PrincipalArn: !GetAtt PipelineRole.Arn
      AccessPolicies: 
        - PolicyArn: 'arn:aws:eks::aws:cluster-access-policy/AmazonEKSAdminPolicy'
          AccessScope:
            Type: 'cluster'

  EKSAccessEntryForWSParticipant:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EKSCluster
      PrincipalArn: !Sub arn:aws:iam::${AWS::AccountId}:role/WSParticipantRole
      Type: STANDARD
      AccessPolicies: 
        - PolicyArn: 'arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy'
          AccessScope:
            Type: 'cluster'


  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      PipelineType: V2
      ExecutionMode: QUEUED
      ArtifactStore:
        Type: S3
        Location: !Ref Bucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Ref Bucket
                S3ObjectKey: manifest.zip
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: EKS
                Version: '1'
              Configuration:
                ClusterName: !Ref EKSCluster
                ManifestFiles: !Ref S3ManifestFileName
              InputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
    
  SourceCodeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  SourceCodeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Runtime: python3.10
      Role: !GetAtt SourceCodeLambdaRole.Arn
      MemorySize: 128
      Timeout: 15
      Environment:
        Variables:
          DESTINATION_BUCKET: !Ref Bucket
          SOURCE_CODE_URL: !Ref SourceCodeUrl
          DEPLOYMENT_FILE: !Ref S3ManifestFileName
      Code:
        ZipFile: |
          import os
          import boto3
          import cfnresponse
          import urllib3
          import zipfile
          from io import BytesIO

          def empty_bucket(bucket_name):
              s3 = boto3.resource('s3')
              bucket = s3.Bucket(bucket_name)
              
              # Delete all object versions
              bucket.object_versions.delete()
              
              # Delete remaining objects
              bucket.objects.all().delete()
          def lambda_handler(event, context):
              responseData = {}
              responseResult = cfnresponse.FAILED
              try:
                  # Get environment variables
                  destinationBucket = os.environ['DESTINATION_BUCKET']
                  url = os.environ['SOURCE_CODE_URL']
                  filename = os.environ['DEPLOYMENT_FILE']

                  # Handle stack deletion
                  if event['RequestType'] == 'Delete':
                      empty_bucket(destinationBucket)
                      responseData['Data'] = f"Successfully emptied bucket {destinationBucket}"
                      responseResult = cfnresponse.SUCCESS
                      cfnresponse.send(event, context, responseResult, responseData, "CustomResourcePhysicalID")
                      return
                      
                  # Download YAML content
                  http = urllib3.PoolManager()
                  response = http.request('GET', url)
                  
                  if response.status != 200:
                      raise Exception(f"Failed to download YAML. Status code: {response.status}")
                  
                  yaml_content = response.data
                  
                  # Create ZIP file in memory
                  zip_buffer = BytesIO()
                  with zipfile.ZipFile(zip_buffer, 'w', zipfile.ZIP_DEFLATED) as zip_file:
                      # Add the YAML content to the ZIP
                      zip_file.writestr(filename, yaml_content)
                  
                  # Seek to the beginning of the buffer
                  zip_buffer.seek(0)
                  
                  # Upload ZIP to S3
                  s3_client = boto3.client('s3')
                  s3_client.upload_fileobj(
                      zip_buffer,
                      destinationBucket,
                      'manifest.zip',
                      ExtraArgs={
                          'ContentType': 'application/zip'
                      }
                  )
                  
                  responseData['Data'] = "Successfully uploaded source.zip containing manifest.yaml"
                  responseResult = cfnresponse.SUCCESS
                  
              except Exception as e:
                  responseData['Data'] = str(e)
                  
              finally:
                  cfnresponse.send(event, context, responseResult, responseData, "CustomResourcePhysicalID")
              
              return 

  PushCodeCustom:
    Type: Custom::LoadSourceData
    DependsOn:
      - EKSCluster
      - NodeGroup
      - EKSAccessEntry
      - Pipeline
    Properties:
      ServiceToken: !GetAtt SourceCodeLambdaFunction.Arn
  

  
  AmpWorkspace:
    Type: AWS::APS::Workspace
    Properties:
      Alias: !Ref AmpWorkspaceName
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-amp
  AMPScraper:
    Type: AWS::APS::Scraper
    DependsOn:
      - EKSCluster
      - NodeGroup
    Properties:
      Source:
        EksConfiguration:
          ClusterArn: !GetAtt EKSCluster.Arn
          SecurityGroupIds:
            - !Ref EksClusterSecurityGroup
          SubnetIds:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      Destination:
        AmpConfiguration:
          WorkspaceArn: !GetAtt AmpWorkspace.Arn
      ScrapeConfiguration:
        ConfigurationBlob: "global:\n  scrape_interval: 30s\n  # external_labels:\n    # clusterArn: ws-eks-1\nscrape_configs:\n  # pod metrics\n  - job_name: pod_exporter\n    kubernetes_sd_configs:\n      - role: pod\n  # container metrics\n  - job_name: cadvisor\n    scheme: https\n    authorization:\n      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n    kubernetes_sd_configs:\n      - role: node\n    relabel_configs:\n      - action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n      - replacement: kubernetes.default.svc:443\n        target_label: __address__\n      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n        target_label: __metrics_path__\n        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor\n  # apiserver metrics\n  - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n    job_name: kubernetes-apiservers\n    kubernetes_sd_configs:\n    - role: endpoints\n    relabel_configs:\n    - action: keep\n      regex: default;kubernetes;https\n      source_labels:\n      - __meta_kubernetes_namespace\n      - __meta_kubernetes_service_name\n      - __meta_kubernetes_endpoint_port_name\n    scheme: https\n  # kube proxy metrics\n  - job_name: kube-proxy\n    honor_labels: true\n    kubernetes_sd_configs:\n    - role: pod\n    relabel_configs:\n    - action: keep\n      source_labels:\n      - __meta_kubernetes_namespace\n      - __meta_kubernetes_pod_name\n      separator: '/'\n      regex: 'kube-system/kube-proxy.+'\n    - source_labels:\n      - __address__\n      action: replace\n      target_label: __address__\n      regex: (.+?)(\\:\\d+)?\n      replacement: $1:10249"

  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    DependsOn:
      - EKSCluster
    Properties:
      AddonName: eks-pod-identity-agent
      ClusterName: !Ref EKSCluster
      AddonVersion: v1.3.5-eksbuild.2 
      ResolveConflicts: OVERWRITE

  # IAM Role for the Pod Identity Agent
  PodIdentityAgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
Outputs:
  ClusterName:
    Description: The name of the EKS cluster
    Value: !Ref EKSCluster
  
  Pipeline:
    Description: The CodePipeline
    Value: !Ref Pipeline

  AmpWorkspaceId:
    Description: Amazon Managed Prometheus Workspace ID
    Value: !GetAtt AmpWorkspace.WorkspaceId

  ScraperId:
    Description: ID of the created AMP scraper
    Value: !GetAtt AMPScraper.ScraperId
