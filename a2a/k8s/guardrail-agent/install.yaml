---
apiVersion: v1
kind: Namespace
metadata:
  name: guardrail-agent
  labels:
    app.kubernetes.io/name: guardrail-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardrail-agent
  namespace: guardrail-agent
  labels:
    app.kubernetes.io/name: guardrail-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrail-agent-config
  namespace: guardrail-agent
data:
  Region: "${AWS_REGION}"
  EKS_CLUSTER_NAME: "${EKS_CLUSTER_NAME}"
  AGENT_URL: "${AGENT_URL}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-agent
  namespace: guardrail-agent
  labels:
    app.kubernetes.io/name: guardrail-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guardrail-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guardrail-agent
    spec:
      serviceAccountName: guardrail-agent
      containers:
        - name: agent
          image: ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/guardrail-agent:${IMAGE_TAG}
          ports:
            - containerPort: 9001
              name: a2a
              protocol: TCP
          envFrom:
            - configMapRef:
                name: guardrail-agent-config
          resources:
            requests:
              cpu: "128m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: guardrail-agent
  namespace: guardrail-agent
  labels:
    app.kubernetes.io/name: guardrail-agent
spec:
  type: ClusterIP
  ports:
    - port: 9001
      targetPort: a2a
      protocol: TCP
      name: a2a
  selector:
    app.kubernetes.io/name: guardrail-agent
