---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd-agent
  labels:
    app.kubernetes.io/name: argocd-agent-eks
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-agent-eks
  namespace: argocd-agent
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${ACCOUNT_ID}:role/ArgocdAgentEKSRole
  labels:
    app.kubernetes.io/name: argocd-agent-eks
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-agent-config
  namespace: argocd-agent
  labels:
    app.kubernetes.io/name: argocd-agent-eks
data:
  Region: "${AWS_REGION}"
  EKS_CLUSTER_NAME: "${EKS_CLUSTER_NAME}"
  ALLOWED_ACTIONS: "restart,rollback,memory_adjustment,diagnostics"
  AGENT_URL: "${AGENT_URL}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-agent-eks
  namespace: argocd-agent
  labels:
    app.kubernetes.io/name: argocd-agent-eks
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-agent-eks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-agent-eks
    spec:
      serviceAccountName: argocd-agent-eks
      containers:
        - name: agent
          image: ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/argocd-agent-eks:${IMAGE_TAG}
          ports:
            - containerPort: 9000
              name: a2a
              protocol: TCP
          envFrom:
            - configMapRef:
                name: argocd-agent-config
          env:
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: AWS_REGION
              value: "${AWS_REGION}"
          resources:
            requests:
              cpu: "256m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-agent-eks
  namespace: argocd-agent
  labels:
    app.kubernetes.io/name: argocd-agent-eks
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: a2a
      protocol: TCP
      name: a2a
  selector:
    app.kubernetes.io/name: argocd-agent-eks
